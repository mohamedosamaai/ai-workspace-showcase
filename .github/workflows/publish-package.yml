name: Publish Package & SLSA Provenance

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mohamedosamaai'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Types & Dist
        run: npm run build

      - name: Generate Package Artifact
        run: |
          mkdir -p ./dist-pack
          npm pack --pack-destination ./dist-pack

      - name: Attest Build Provenance (SLSA v2)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist-pack/*.tgz'

      - name: Publish Package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish ./dist-pack/*.tgz --access public
