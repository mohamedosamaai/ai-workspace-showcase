name: 🐛 Bug Report
description: Report a bug or inconsistency in the public contracts or mock layer
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Bagback AI Workspace Showcase!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Import `scanPromptSafety`
        2. Call with input '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
