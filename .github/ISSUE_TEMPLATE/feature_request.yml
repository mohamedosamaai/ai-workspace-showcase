name: 🚀 Feature Request
description: Suggest a new contract schema, MCP tool binding, or mock capability
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for proposing a feature for Bagback AI Workspace!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or new AI integration?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new TypeScript contract you'd like to see.
    validations:
      required: true
